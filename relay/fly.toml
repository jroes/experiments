# Optional alternative to Cloudflare. Needs a Fly.io account with a card.
# fly launch --no-deploy --copy-config   (pick a unique app name)
# fly volumes create relay_data --size 1
# fly deploy
app = "sector-relay-CHANGE-ME"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_FILE = "/data/relay-data.json"
  CLIENT_IP_HEADER = "fly-client-ip"   # so per-address limits see the real visitor, not the Fly proxy

[[mounts]]
  source = "relay_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
