name = "sector-relay"
main = "src/index.js"
compatibility_date = "2025-04-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "GATE"
class_name = "Gate"

# SQLite-backed Durable Objects are the kind available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Gate"]

# Limits have safe defaults (see src/limits.js). Override any of them here, for example:
# [vars]
# RELAY_ROOM_REQ_PER_MIN = "240"
# RELAY_IP_CREATE_PER_HOUR = "6"
# RELAY_GLOBAL_CREATE_PER_DAY = "300"
# RELAY_BODY_MAX = "8192"

# Optional: a per-address request limit using Cloudflare's rate limiting binding. It needs a recent wrangler and may not be
# available on every plan, and its counts are per Cloudflare location, so it is a soft limit. Uncomment to try it.
# [[ratelimits]]
# name = "RL"
# namespace_id = "1001"
# simple = { limit = 120, period = 60 }
