name: Deploy elf-punch

# Pushes to main that touch elf-punch/ run its tests, then deploy to Fly.
# Needs the repo secret FLY_API_TOKEN: a deploy token for this one app (`fly tokens create deploy -a elf-castle-wood-puncher`).
on:
  push:
    branches: [main]
    paths:
      - "elf-punch/**"
      - ".github/workflows/deploy-elf-punch.yml"
  workflow_dispatch:

concurrency:
  group: deploy-elf-punch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elf-punch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test --release
      - run: cargo build --release
      - run: npm ci && npm test
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
