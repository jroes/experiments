name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Lockstep tests against a real relay over HTTP
        run: |
          node relay/src/node-server.js &
          sleep 2
          RELAY_URL=http://localhost:8787 node --test tests/lockstep.test.mjs

  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: verification/run-tlc.sh
