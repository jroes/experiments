name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: verification/run-tlc.sh

  elf-punch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elf-punch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test --release
      - run: cargo build --release
      - run: npm ci && npm test
      - name: Lockstep tests (online play) against the real server
        run: |
          # the suite plays many games from one address, so lift the per-address and per-game limits for this run
          export PORT=8135 WORLD_FILE=/tmp/world.json KV_DIR=/tmp/kv KV_IP_REQ_PER_MIN=1000000 KV_IP_WRITE_PER_MIN=1000000 KV_NS_REQ_PER_MIN=1000000 KV_NS_WRITE_PER_MIN=1000000 KV_IP_NEW_NS_PER_HOUR=1000000 KV_NEW_NS_PER_DAY=1000000 KV_NS_COUNT=100000 KV_TOTAL_BYTES=2000000000 KV_NS_BYTES=500000000
          target/release/elf-punch &
          sleep 2
          KV_URL=http://127.0.0.1:8135 node --test ../tests/lockstep.test.mjs ../tests/roster.test.mjs
