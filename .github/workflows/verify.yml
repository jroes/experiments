name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Lockstep tests against a real relay over HTTP
        run: |
          # the suite plays many games from one address, so lift the rate limits for this run
          export RELAY_ROOM_REQ_PER_MIN=1000000 RELAY_ROOM_WRITES_PER_MIN=1000000 RELAY_IP_REQ_PER_MIN=1000000 RELAY_IP_CREATE_PER_HOUR=100000 RELAY_GLOBAL_CREATE_PER_DAY=1000000
          node relay/src/node-server.js &
          sleep 2
          RELAY_URL=http://localhost:8787 node --test tests/lockstep.test.mjs

  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: verification/run-tlc.sh

  elf-punch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elf-punch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test --release
      - run: cargo build --release
      - run: npm ci && npm test
