app = "elf-castle-wood-puncher"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 40
    hard_limit = 60

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  timeout = "3s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# World save file lives on a 1 GB volume (created by `fly volumes create world --size 1`, or `.fly` once it learns to).
[mounts]
  source = "world"
  destination = "/data"
